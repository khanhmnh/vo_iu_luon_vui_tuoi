<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Gửi em, 20/10</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Be+Vietnam+Pro:wght@400&display=swap" rel="stylesheet">
<style>
:root{--rose:#ff8fab;--ink:#ffe9ef;--bg:#050514;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font:400 15px "Be Vietnam Pro",system-ui,sans-serif}
#scene{position:fixed;inset:0;background:radial-gradient(60% 50% at 50% 55%,#1c1830,#0a0a1c 55%,#030310)}
svg#art{position:absolute;inset:0;width:100%;height:100%}
.sw{animation:sw 4s ease-in-out infinite;transform-origin:var(--o)}
@keyframes sw{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.ff{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffe45c;box-shadow:0 0 8px #ffe45c;animation:ff 7s ease-in-out infinite;opacity:0}
@keyframes ff{0%,100%{opacity:0;transform:translate(0,0)}30%,70%{opacity:.9}50%{transform:translate(18px,-30px)}}
.ht{position:absolute;bottom:-60px;display:grid;place-items:center;color:#ff8fab;border-radius:50%;pointer-events:none;z-index:2;animation:up var(--d) linear forwards}
.ht.ring{border:1.5px solid #ff8fab99}
@keyframes up{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}50%{transform:translate(var(--x),-55vh)}100%{transform:translate(0,-115vh);opacity:.2}}
#fall{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.fl{position:absolute;top:-30vh;animation:dn var(--d) linear forwards}
@keyframes dn{to{transform:translateY(140vh)}}
.fl>div{animation:sg 3.4s ease-in-out infinite alternate}
@keyframes sg{from{transform:rotate(-8deg) translateX(-10px)}to{transform:rotate(8deg) translateX(10px)}}
.wish{padding:9px 16px;border-radius:99px;background:#ffe9efdd;color:#4a1d3d;max-width:70vw;text-align:center;box-shadow:0 6px 24px #ff8fab55}
.pic{background:#fff;padding:6px 6px 22px;border-radius:4px;box-shadow:0 8px 24px #0009}
.pic img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
#ctl{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:10;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#ctl.hide{display:none}
button{font:inherit;color:var(--ink);background:#ffffff14;border:1px solid #ff8fab66;border-radius:99px;padding:8px 14px;backdrop-filter:blur(6px);cursor:pointer}
button[aria-pressed=true]{background:var(--rose);color:#3a0f26;border-color:var(--rose)}
button:focus-visible,textarea:focus-visible{outline:2px solid #ffd27a;outline-offset:2px}
.seg{display:flex;gap:4px;padding:4px;border:1px solid #ff8fab44;border-radius:99px}
.seg button{padding:5px 10px;border:0;background:none}
.seg button[aria-pressed=true]{background:var(--rose)}
#ed{padding:5px 10px;font-size:13px;opacity:.75}
#note{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);text-align:center;color:#d9b3c4;font-size:13px;z-index:6;pointer-events:none}
dialog{background:#2a1233;color:var(--ink);border:1px solid #ff8fab66;border-radius:14px;padding:18px;width:min(440px,92vw)}
dialog::backdrop{background:#000a}
dialog textarea{width:100%;height:46vh;background:#150a1c;color:var(--ink);border:1px solid #ff8fab44;border-radius:8px;padding:10px;font:inherit;resize:vertical}
dialog p{margin:0 0 10px;color:#d9b3c4;font-size:13px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(70% 60% at 50% 50%,#2a1233,#0a0618);transition:opacity 1s}
#intro.gone{opacity:0;pointer-events:none}
#env{position:relative;width:min(300px,78vw);aspect-ratio:3/2;margin-top:110px;cursor:pointer;background:none;border:0;padding:0;backdrop-filter:none}
#env .back{position:absolute;inset:0;background:#d9627c;border-radius:8px}
#env .fls{position:absolute;left:-4%;width:108%;bottom:34%;transition:transform 1.1s cubic-bezier(.3,1.3,.5,1);z-index:1;overflow:visible}
#env.open .fls{transform:translateY(-22%)}
#env .front{position:absolute;inset:0;border-radius:8px;background:#ff9fb5;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);z-index:2}
#env .flap{position:absolute;left:0;right:0;top:0;height:58%;background:#ff7893;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s;z-index:3}
#env.open .flap{transform:rotateX(180deg);z-index:0}
#env .heart{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:26px;color:#fff;z-index:4;transition:opacity .4s}
#env.open .heart{opacity:0}
#tap{position:absolute;bottom:14%;left:0;right:0;text-align:center;font:600 26px "Dancing Script",cursive;animation:pl 1.8s ease-in-out infinite}
@keyframes pl{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.sw,.ff,#tap{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <linearGradient id="pt" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff6f9"/><stop offset=".45" stop-color="#ffc6d8"/><stop offset="1" stop-color="#ff8fb3"/></linearGradient>
 <linearGradient id="lf" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0d5a2c"/><stop offset="1" stop-color="#3ad073"/></linearGradient>
 <radialGradient id="gl"><stop offset="0" stop-color="#ffd9e6" stop-opacity=".45"/><stop offset="1" stop-color="#ffd9e6" stop-opacity="0"/></radialGradient>
</defs></svg>

<div id="scene"><svg id="art" viewBox="0 0 600 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg></div>
<div id="fall"></div>

<div id="ctl" class="hide">
 <button id="bW" aria-pressed="false">💌 Lời chúc</button>
 <button id="bH" aria-pressed="false">🌷 Người ấy</button>
 <button id="bU" aria-pressed="false">💑 Hai đứa</button>
 <div class="seg" role="group" aria-label="Tốc độ rơi">
  <button data-s="slow" aria-pressed="false">Chậm</button>
  <button data-s="mid" aria-pressed="true">Vừa</button>
  <button data-s="fast" aria-pressed="false">Nhanh</button>
 </div>
 <button id="ed" aria-label="Sửa lời chúc">✏️ Sửa lời chúc</button>
</div>
<div id="note"></div>

<dialog id="dlg">
 <p>Mỗi dòng là một lời chúc. Lưu xong sẽ nhớ trên thiết bị này.</p>
 <textarea id="ta"></textarea>
 <div class="row"><button id="rs">Về mặc định</button><button id="cl">Đóng</button><button id="sv" aria-pressed="true">Lưu</button></div>
</dialog>

<div id="intro">
 <button id="env" aria-label="Mở thư">
  <svg class="fls" id="envFl" viewBox="0 0 300 240" aria-hidden="true"></svg>
  <div class="back"></div><div class="front"></div><div class="flap"></div><div class="heart">♥</div>
 </button>
 <div id="tap">Chạm để mở thư</div>
</div>

const PET = "M0 0C-15 -6 -17 -30 -7 -41L0 -35L7 -41C17 -30 15 -6 0 0Z";
function bloom(x,y,z,r,q){
  let a="",b="",st="";
  for(let k=0;k<5;k++){ a+=`<path d="${PET}" transform="rotate(${k*72})"/>`; b+=`<path d="${PET}" transform="rotate(${k*72+36}) scale(.62)"/>`; }
  for(let k=0;k<9;k++){ const t=k*40*Math.PI/180,l=9+(k%3)*2.2,px=Math.sin(t)*l,py=-Math.cos(t)*l; st+=`<line x1="0" y1="0" x2="${px}" y2="${py}"/><circle cx="${px}" cy="${py}" r="1.5"/>`; }
  return `<g transform="translate(${x} ${y}) rotate(${r}) scale(${z} ${z*q})"><g fill="url(#pt)" stroke="#ff7fa655" stroke-width=".5">${a}</g><g fill="#ffe3ec" opacity=".85">${b}</g><circle r="5.5" fill="#fff"/><g stroke="#f0b000" stroke-width=".7" fill="#ffd23c">${st}</g><circle r="3" fill="#ffc400"/></g>`;
}
const leaf=(x,y,a,s)=>`<g transform="translate(${x} ${y}) rotate(${a}) scale(${s})"><path d="M0 0C11 -10 11 -30 0 -50C-11 -30 -11 -10 0 0Z" fill="url(#lf)"/><path d="M0 -2V-40" stroke="#8be6a8" stroke-opacity=".35" stroke-width=".8"/></g>`;
function plant(hx,hy,bx,by,z,r,q,w=4,leaves=3){
  const cx=bx+(hx-bx)*.1, cy=(hy+by)/2;
  let s=`<path d="M${bx} ${by}Q${cx} ${cy} ${hx} ${hy}" stroke="#1f9a4a" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
  for(let i=0;i<leaves;i++){ const t=.25+i*.2, u=1-t, px=u*u*bx+2*u*t*cx+t*t*hx, py=u*u*by+2*u*t*cy+t*t*hy;
    s+=leaf(px,py,(i%2?1:-1)*R(50,85),R(.85,1.3)*z); }
  return s+bloom(hx,hy,z,r,q);
}

 s+=`<g class="sw" style="--o:${x}px 600px;animation-duration:${R(3.5,5.5)}s;animation-delay:-${R(0,5)}s"><path d="M${x} 600Q${x+b*.3} ${600-h*.6} ${x+b} ${600-h}" stroke="#1f9a4a" stroke-width="3" fill="none" stroke-linecap="round"/>${bloom(x+b,600-h,.38,b,.75)}</g>`; }
for(let i=0;i<30;i++){ const a=R(-88,88),x=R(180,420),y=R(505,598);
 s+=`<g class="sw" style="--o:${x}px ${y}px;animation-duration:${R(4,7)}s;animation-delay:-${R(0,5)}s">${leaf(x,y,a,R(.9,1.5))}</g>`; }
art.innerHTML=s;

/* ---- Hoa trên phong thư ---- */
$("#envFl").innerHTML=[[150,80,150,1.2,0,.82],[78,115,104,1,-14,.8],[222,108,196,1.05,13,.8]]
 .map(([hx,hy,bx,z,r,q])=>plant(hx,hy,bx,240,z,r,q,3.5,2)).join("");

/* ---- Đom đóm ---- */
for(let i=0;i<26;i++){ const d=document.createElement("i"); d.className="ff";
 d.style.cssText=`left:${R(15,85)}%;top:${R(25,75)}%;animation-delay:-${R(0,7)}s;animation-duration:${R(5,9)}s`; $("#scene").appendChild(d); }

/* ---- Tim bay ---- */
function heart(){ const d=document.createElement("div"), z=R(14,40), ring=Math.random()<.55;
 d.className="ht"+(ring?" ring":""); d.textContent="♥";
 d.style.cssText=`left:${R(2,96)}%;width:${ring?z*2:z}px;height:${ring?z*2:z}px;font-size:${z}px;--d:${R(8,15)}s;--x:${R(-40,40)}px`;
 $("#scene").appendChild(d); d.addEventListener("animationend",()=>d.remove()); }
setInterval(heart,650);

/* ---- Rơi chữ và ảnh ---- */
const SP={slow:{d:16,g:2000},mid:{d:10,g:1300},fast:{d:5.5,g:700}}; let sp="mid";
const on={W:false,H:false,U:false}, pool={H:PH.her,U:PH.us}; let wi=0, act=[], recent=[];
const bag={H:[],U:[]}, lastPic={H:-1,U:-1};
function nextPic(k){ const n0=pool[k].length;
 if(!bag[k].length){ bag[k]=pool[k].map((_,i)=>i).sort(()=>Math.random()-.5); const n=bag[k].length;
  if(n>1&&bag[k][n-1]===lastPic[k]) [bag[k][0],bag[k][n-1]]=[bag[k][n-1],bag[k][0]]; }
 return lastPic[k]=bag[k].pop(); }
function spawn(el){
 const W=innerWidth,H=innerHeight,d=SP[sp].d,v=H*1.4/d,now=performance.now();
 const f=document.createElement("div"),w=document.createElement("div"); f.className="fl"; f.style.setProperty("--d",d+"s");
 w.appendChild(el); f.appendChild(w); $("#fall").appendChild(f);
 const bw=el.offsetWidth+32, bh=el.offsetHeight+32;
 act=act.filter(a=>now-a.t<a.life);
 let best=null,bs=-1;
 for(let i=0;i<18;i++){
  const x=Math.random()*Math.max(1,W-bw);
  if(!act.every(a=>(now-a.t)/1000*a.v>bh||x+bw<a.x||x>a.x+a.w)) continue;
  const c=x+bw/2, sc=Math.min(W,...recent.map(r=>Math.abs(r-c)));
  if(sc>bs){bs=sc;best=x;}
 }
 if(best===null){ f.remove(); return false; }
 f.style.left=(best+16)+"px"; act.push({t:now,v,x:best,w:bw,life:d*1000});
 recent.push(best+bw/2); if(recent.length>4) recent.shift();
 f.addEventListener("animationend",()=>f.remove()); return true; }
function loop(k){ let delay=SP[sp].g*R(.93,1.07);
 if(on[k]){ const e=document.createElement("div"); let idx=-1,ok;
  if(k==="W"){ e.className="wish"; e.textContent=wishes[wi%wishes.length]; ok=spawn(e); if(ok) wi++; }
  else { e.className="pic"; e.style.width=R(96,128)+"px"; idx=nextPic(k); const im=new Image(); im.alt=""; im.src=pool[k][idx]; e.appendChild(im);
   ok=spawn(e); if(!ok) bag[k].push(idx); }
  if(!ok) delay=250; }
 setTimeout(()=>loop(k),delay); }
["W","H","U"].forEach(loop);
[["#bW","W"],["#bH","H"],["#bU","U"]].forEach(([id,k])=>$(id).onclick=e=>{ on[k]=!on[k]; e.currentTarget.setAttribute("aria-pressed",on[k]); });
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ sp=b.dataset.s;
 document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b)); });

/* ---- Sửa lời chúc ---- */
$("#ed").onclick=()=>{ $("#ta").value=wishes.join("\n"); $("#dlg").showModal(); };
$("#cl").onclick=()=>$("#dlg").close();
$("#sv").onclick=()=>{ const v=$("#ta").value.split("\n").map(x=>x.trim()).filter(Boolean);
 if(v.length){ wishes=v; wi=0; try{ localStorage.setItem("w1020",JSON.stringify(v)); }catch(e){} } $("#dlg").close(); };
$("#rs").onclick=()=>{ $("#ta").value=DEFAULT_WISHES.join("\n"); };

/* ---- Phong thư ---- */
$("#env").onclick=e=>{ const v=e.currentTarget; if(v.classList.contains("open")) return; v.classList.add("open"); $("#tap").style.display="none";
 setTimeout(()=>{ $("#intro").classList.add("gone"); $("#ctl").classList.remove("hide");
  $("#note").textContent="Bấm các nút bên phải nha 💗"; setTimeout(()=>$("#note").textContent="",5000); },1700); };
</script>
